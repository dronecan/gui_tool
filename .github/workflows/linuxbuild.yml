name: Linux CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fuse file

    - name: Build Linux AppImage
      run: bash linuxbuild.sh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AppImage Package
        path: dist/*.AppImage
